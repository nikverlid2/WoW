<!doctype html><html lang="ru"><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.55 Arial,sans-serif;color:#293137;background:#f3f5f5}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ec542b;outline-offset:3px}header{padding:22px 5%;background:white;border-bottom:1px solid #e2e7e7;display:flex;justify-content:space-between;align-items:center;gap:15px}header b{font-size:23px}header b span{color:#ec542b}.primary{background:#ec542b;border:0;color:#fff;padding:13px 20px;border-radius:12px;font-weight:600}.secondary{background:white;border:1px solid #dce2e2;border-radius:10px;padding:9px 14px;color:#303c40}.login{max-width:970px;margin:8vh auto;background:white;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 20px 60px #1c2e3710}.welcome{padding:55px 40px;background:#252d32;color:#fff}.welcome h1{font-size:40px;line-height:1.15;letter-spacing:-1px}.welcome p{color:#b8c2c7}.login form{padding:42px;display:grid;gap:15px}.login label{display:grid;gap:7px;color:#78848a;font-size:12px}input,textarea{border:1px solid #dce2e3;border-radius:10px;background:white;padding:12px;width:100%;color:#263139}textarea{min-height:135px;resize:vertical}.error{color:#ad402b;min-height:24px;font-size:13px}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);max-width:1450px;margin:auto;min-height:85vh}nav{padding:25px 14px;background:white;display:flex;flex-direction:column;gap:8px}nav button{border:0;background:white;padding:13px;text-align:left;border-radius:12px;color:#425159}nav button.active{background:#fff0e9;color:#b64e2c;font-weight:bold}.main{padding:30px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.heading h1{margin:0;font-size:30px;letter-spacing:-1px}.sub{color:#859094;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.card{background:white;border:1px solid #e2e7e7;border-radius:16px;padding:22px;margin-bottom:16px}.metrics .card{margin:0}.card h2{font-size:18px;margin:0 0 15px}.metric{display:block;font-size:27px;margin-top:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;font-weight:400;font-size:11px;color:#859096;padding:12px}td{padding:15px 12px;border-top:1px solid #edf0f0}table button{background:#f3f5f5;border:0;border-radius:8px;padding:7px 11px}.status{background:#fff0e5;color:#b66c3c;border-radius:20px;padding:5px 11px;font-size:11px;display:inline-block}.track{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:23px 0}.track span{padding-top:9px;border-top:4px solid #e5e9e9;color:#879397;font-size:11px}.track .done{border-color:#ef7957;color:#394950}.kv{display:grid;grid-template-columns:180px 1fr;gap:10px 22px}.kv dt{color:#879297}.kv dd{margin:0;overflow-wrap:anywhere}.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e8eded;padding:16px 0}.doc a{color:#c25230;text-decoration:none}.request-text{white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:#8a969b;padding:24px 0}.request-form{display:grid;gap:15px}.request-form label{display:grid;gap:8px}.back{border:0;background:none;color:#bd5534;padding:0 0 18px}.top-actions{display:flex;gap:10px;align-items:center}#global-error{padding:0 5%}a{color:#be5132}
@media(max-width:750px){.login{margin:20px;display:block}.welcome{padding:25px}.welcome h1{font-size:29px}.login form{padding:25px}.layout{display:block}nav{flex-direction:row;overflow:auto;padding:12px}nav button{white-space:nowrap}.main{padding:17px}.heading{align-items:flex-start;flex-direction:column}.metrics{gap:8px}.metrics .card{padding:12px}.metric{font-size:19px}.kv{grid-template-columns:1fr;gap:4px}.kv dd{margin-bottom:12px}.top-actions{flex-wrap:wrap}.top-actions .sub{display:none}.card{padding:17px}header{padding:16px}header b{font-size:19px}}
</style></head><body><header><b>кламас<span> / B2B</span></b><div id="top-actions" class="top-actions"></div></header><div id="global-error" class="error" role="alert"></div><div id="app"></div><script>
let token='',data=null,tab='Обзор',currentOrder=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rub=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽',status=s=>'<span class="status">'+esc(s)+'</span>';
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args))}
function error(e){$('global-error').textContent=e.message||String(e)}
function showLogin(){token='';data=null;$('top-actions').innerHTML='';$('app').innerHTML=`<div class="login"><div class="welcome"><p>КАБИНЕТ КОМПАНИИ</p><h1>Все закупки.<br>Один кабинет.</h1><p>Заказы, отгрузки, платежи и документы вашей компании.</p></div><form id="login"><h2>Вход в Кламас B2B</h2><label>Email<input type="email" name="email" autocomplete="username" required maxlength="254"></label><label>Личный ключ доступа<input type="password" name="key" autocomplete="current-password" required maxlength="200"></label><button class="primary">Войти</button><div id="login-error" class="error" role="alert"></div><p class="sub">Ключ выдаёт менеджер компании. Для восстановления доступа обратитесь к нему.</p></form></div>`;$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;$('login-error').textContent='';try{const r=await call('login',e.target.email.value,e.target.key.value);token=r.token;tab='Обзор';await refresh()}catch(err){if($('login-error'))$('login-error').textContent=err.message;else error(err)}finally{b.disabled=false}}}
function orderTable(orders){return orders.length?`<div class="table-wrap"><table><thead><tr><th>Заказ</th><th>Дата</th><th>Название</th><th>Сумма</th><th>Остаток</th><th>Статус</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o['ID заказа'])}</td><td>${esc(o.Дата)}</td><td>${esc(o.Название)}</td><td>${rub(o['Сумма, ₽'])}</td><td>${rub(o['Остаток, ₽'])}</td><td>${status(o.Статус)}</td><td><button data-order="${esc(o['ID заказа'])}">Открыть</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Заказов пока нет.</div>'}
function table(rows,columns){if(!rows.length)return '<p class="empty">Записей пока нет.</p>';return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+columns.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
function detail(){const o=data.orders.find(o=>o['ID заказа']===currentOrder);if(!o)return '';const items=data.items.filter(i=>i['ID заказа']===currentOrder);return `<button class="back" id="back-orders">‹ К заказам</button><div class="card"><h2>${esc(o.Название)} · ${esc(currentOrder)}</h2>${status(o.Статус)}<p>${esc(o['Комментарий для клиента'])}</p>${table(items,['Наименование','Артикул','Количество','Ед.','Цена, ₽','Гарантия','Серийный номер'])}<p>Итого: <b>${rub(o['Сумма, ₽'])}</b> · Оплачено: ${rub(o['Оплачено, ₽'])} · Остаток: ${rub(o['Остаток, ₽'])}</p></div>`}
function render(){const tabs=['Обзор','Заказы','Отгрузки','Платежи','Документы','Обращения','Компания'];let body='';if(tab==='Обзор')body=`<div class="metrics"><div class="card"><span class="sub">Активных заказов</span><b class="metric">${data.orders.filter(o=>!['Завершён','Отменён'].includes(o.Статус)).length}</b></div><div class="card"><span class="sub">К оплате</span><b class="metric">${rub(data.orders.filter(o=>o.Статус!=='Отменён').reduce((s,o)=>s+Math.max(0,o['Остаток, ₽']),0))}</b></div><div class="card"><span class="sub">Поставок в пути</span><b class="metric">${data.shipments.filter(s=>s.Статус==='В пути').length}</b></div></div><div class="card"><h2>Последние заказы</h2>${orderTable(data.orders.slice(-6).reverse())}</div>`;
if(tab==='Заказы')body=currentOrder?detail():`<div class="card">${orderTable(data.orders)}</div>`;
if(tab==='Отгрузки')body=data.shipments.map(s=>{const steps=['Согласовано','На складе','В пути','Получено'],i=steps.indexOf(s.Статус),lines=data.shipmentItems.filter(x=>x['ID отгрузки']===s['ID отгрузки']).map(x=>{const p=data.items.find(p=>p['ID позиции']===x['ID позиции']);return esc(p?.Наименование||x['ID позиции'])+' × '+esc(x.Количество)});return `<div class="card"><h2>${esc(s['ID отгрузки'])} / ${esc(s['ID заказа'])}</h2>${status(s.Статус)}<div class="track">${steps.map((t,n)=>`<span class="${n<=i?'done':''}">${t}</span>`).join('')}</div><p>${lines.join('<br>')}</p><p>${esc(s.Способ)} · ${esc(s.Адрес)}</p><p class="sub">План: ${esc(s['Плановая дата'])} · Отправлено: ${esc(s['Дата отправки'])} · Получено: ${esc(s['Дата получения'])}</p><p>${esc(s.Перевозчик)} ${s.Трек?' · Трек: '+esc(s.Трек):''}</p><p>${esc(s['Комментарий для клиента'])}</p></div>`}).join('')||'<div class="empty">Отгрузок пока нет.</div>';
if(tab==='Платежи')body=`<div class="card">${table(data.payments,['ID платежа','ID заказа','Дата','Сумма, ₽','Назначение','Статус'])}</div>`;
if(tab==='Документы')body=`<div class="card">${data.documents.map(d=>{let valid=false;try{const u=new URL(d.Ссылка);valid=u.protocol==='https:'&&['drive.google.com','docs.google.com'].includes(u.hostname)}catch{}return `<div class="doc"><div><b>${esc(d.Название)}</b><div class="sub">${esc(d.Тип)} ${esc(d.Номер)} · ${esc(d.Дата)} · ${esc(d['ID заказа'])}</div></div>${valid?`<a href="${esc(d.Ссылка)}" target="_blank" rel="noopener">Открыть ↗</a>`:'<span class="sub">Файл готовится</span>'}</div>`}).join('')||'<p class="empty">Документов пока нет.</p>'}</div>`;
if(tab==='Обращения')body=`<div class="card"><h2>Написать менеджеру</h2><form class="request-form" id="request-form"><label>Тема<input name="subject" required minlength="3" maxlength="150"></label><label>Сообщение<textarea name="text" required minlength="5" maxlength="4000"></textarea></label><button class="primary">Отправить обращение</button><p id="request-result" role="status"></p></form></div>${data.requests.slice().reverse().map(r=>`<div class="card"><h2>${esc(r.Тема)}</h2>${status(r.Статус)}<p class="request-text">${esc(r.Текст)}</p><p class="sub">${esc(r.Дата)} · ${esc(r['ID обращения'])}</p>${r['Ответ менеджера']?`<b>Ответ менеджера</b><p class="request-text">${esc(r['Ответ менеджера'])}</p>`:''}</div>`).join('')}`;
if(tab==='Компания'){const c=data.company;body=`<div class="card"><h2>${esc(c.Название)}</h2><dl class="kv">${['ИНН','КПП','Юридический адрес','Адрес доставки','Контакт','Телефон','Email','Договор','Дата договора','Условия оплаты','Лимит, ₽','Менеджер','Email менеджера','Телефон менеджера','Комментарий для клиента'].map(k=>`<dt>${k}</dt><dd>${esc(c[k])||'—'}</dd>`).join('')}</dl></div>`;}
$('top-actions').innerHTML=`<span class="sub">${esc(data.user.name)}</span><button class="secondary" id="refresh">Обновить</button><button class="secondary" id="logout">Выйти</button>`;$('app').innerHTML=`<div class="layout"><nav>${tabs.map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}">${t}</button>`).join('')}</nav><main class="main"><div class="heading"><div><h1>${tab==='Обзор'?'Ваши закупки':tab}</h1><span class="sub">${esc(data.company.Название)}</span></div><span class="sub">Обновлено ${esc(data.updated)}</span></div>${body}</main></div>`;
if($('request-form'))$('request-form').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const r=await call('createRequest',token,f.subject.value,f.text.value);await refresh();$('request-result').textContent='Обращение '+r.id+' отправлено.'}catch(err){error(err)}finally{b.disabled=false}};
}
async function refresh(){const d=await call('portalData',token);data=d;$('global-error').textContent='';render()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;currentOrder=null;render()}if(b.dataset.order){currentOrder=b.dataset.order;tab='Заказы';render()}if(b.id==='back-orders'){currentOrder=null;render()}if(b.id==='refresh'){b.disabled=true;try{await refresh()}catch(err){error(err)}finally{b.disabled=false}}if(b.id==='logout'){b.disabled=true;try{await call('logout',token)}catch{}showLogin()}});showLogin();
</script></body></html>
